# Serves the built PWA and proxies `/api/` to the API service.
# Installed as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged (non-root, port 8080).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Inherited only by locations without an `add_header` of their own (see the snippet), so each
    # location below that sets Cache-Control includes it again.
    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS. Resolving at request time (through the variable below) lets nginx
    # start before the API is up and follow it when its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed bundles: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Entry points and service worker files must always be revalidated so clients pick up a new
    # deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.webmanifest {
        # `webmanifest` is not in nginx's default mime.types.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: unknown paths render the app, which handles client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
