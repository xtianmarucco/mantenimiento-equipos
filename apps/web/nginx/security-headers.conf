# Response headers sent on every response. Installed as /etc/nginx/snippets/security-headers.conf.
#
# nginx inherits `add_header` from the enclosing block only when the current block defines no
# `add_header` of its own. So every location that adds a header (such as Cache-Control) must
# include this file again, or it silently drops these headers.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
