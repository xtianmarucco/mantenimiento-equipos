# Local stack: PostgreSQL + one-shot migrations + API + web (nginx serving the PWA and proxying
# /api to the API).
# Copy `.env.example` to `.env` first, then: docker compose up --build

name: mantenimiento-equipos

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # PostgreSQL 18 images keep data under a versioned subdirectory of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    ports:
      # Bound to localhost only, for local tools (psql, Prisma migrate from the host).
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot job: `prisma migrate deploy`, then exits. The api starts only if it succeeds.
  # Seed sample data with: docker compose run --rm migrate prisma db seed
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: mantenimiento-equipos/api-migrate:local
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: mantenimiento-equipos/api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not published: reached through the web container's /api/ proxy.
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: mantenimiento-equipos/web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:8080'

volumes:
  db-data:
