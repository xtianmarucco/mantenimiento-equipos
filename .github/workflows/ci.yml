name: CI

on:
  push:
  pull_request:

# One run per branch or PR; a new push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the comment names the release) so a retargeted tag
# cannot run unreviewed code. Update the SHA and the comment together.
jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in package.json (`packageManager`).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  integration:
    name: API integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image as the compose `db` service (keep the tags in sync; see README "Collation version").
    # Throwaway values; nothing here is a real credential.
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mantenimiento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mantenimiento_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite refuses a database whose name does not end in `_test`; it truncates every table.
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/mantenimiento_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Applies the migrations (`prisma migrate deploy`), then runs `*.integration.test.ts`.
      - run: pnpm test:integration

  docker:
    name: Docker images and compose smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Throwaway values for the compose stack; nothing here is a real credential.
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: mantenimiento_ci
      DATABASE_URL: postgresql://ci:ci-only-password@db:5432/mantenimiento_ci
      WEB_PORT: '8080'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build (no registry push) with layers cached in the GitHub Actions cache, and load the
      # images under the tags docker-compose.yml uses so the smoke test runs exactly these.
      - name: Build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: mantenimiento-equipos/api:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Same Dockerfile, `migrate` stage: the one-shot job compose runs before the api. It reuses
      # the api build layers, so it reads the api cache scope as well as its own.
      - name: Build migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          load: true
          tags: mantenimiento-equipos/api-migrate:local
          cache-from: |
            type=gha,scope=api
            type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: mantenimiento-equipos/web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # `--wait` fails the step unless db, api and web all report healthy.
      - name: Start the compose stack
        run: docker compose up --detach --no-build --wait --wait-timeout 120

      # The api only starts after the migrate job succeeded; seeding also exercises the schema.
      - name: Seed the database
        run: docker compose run --rm --no-deps migrate prisma db seed

      - name: Smoke test through nginx
        run: |
          curl --fail --silent --show-error "http://127.0.0.1:${WEB_PORT}/api/health"
          curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:${WEB_PORT}/"
          curl --fail --silent --show-error --head "http://127.0.0.1:${WEB_PORT}/" \
            | grep --ignore-case '^x-content-type-options: nosniff'

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes
